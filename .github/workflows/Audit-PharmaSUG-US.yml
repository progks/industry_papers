name: Audit PharmaSUG US

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Audit years: all, 2026, 2024-2026, or 2024,2026'
        type: string
        required: true
        default: 'all'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check live index and verify committed PDFs
        env:
          YEARS: ${{ inputs.years }}
        run: |
          python -B - <<'PY'
          """Read-only audit against the live PharmaSUG index; no PDF downloads or commits."""
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import unquote, urljoin, urlsplit
          from urllib.request import Request, urlopen
          from urllib.robotparser import RobotFileParser
          
          INDEX = 'https://saslexicon.org/PharmaSUG/PharmaSUG.html'
          AGENT = 'IndustryPapersAudit/1.0'
          
          
          class Table(HTMLParser):
              def __init__(self, html):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = self.cell = self.link = None
                  self.feed(html)
          
              def handle_starttag(self, tag, attrs):
                  if tag == 'tr':
                      self.row = []
                  elif tag in ('td', 'th') and self.row is not None:
                      self.cell = {'text': '', 'links': []}
                  elif tag == 'a':
                      self.link = dict(attrs).get('href', '')
          
              def handle_data(self, text):
                  if self.cell is not None:
                      self.cell['text'] += text
          
              def handle_endtag(self, tag):
                  if tag == 'a':
                      if self.link is not None and self.cell is not None:
                          self.cell['links'].append(self.link)
                      self.link = None
                  elif tag in ('td', 'th') and self.cell is not None:
                      self.cell['text'] = ' '.join(self.cell['text'].split())
                      self.row.append(self.cell)
                      self.cell = None
                  elif tag == 'tr' and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None
          
          
          def years_from_html(html):
              result = {}
              for cells in Table(html).rows:
                  if len(cells) < 2:
                      continue
                  for href in cells[0]['links']:
                      url = urljoin(INDEX, href)
                      p = urlsplit(url)
                      match = re.fullmatch(r'/PharmaSUG/(\d{4})/PharmaSUG_\1\.html', p.path)
                      if match and p.netloc == urlsplit(INDEX).netloc:
                          count = int(cells[1]['text'].replace(',', ''))
                          result[match[1]] = (url, count)
              if not result:
                  raise ValueError('No year rows found; cannot establish completeness')
              return result
          
          
          def ids_from_html(html, base):
              result = []
              for cells in Table(html).rows:
                  links = [urljoin(base, href) for cell in cells for href in cell['links']]
                  pdfs = [url for url in links if urlsplit(url).scheme in ('http', 'https')
                          and urlsplit(url).path.lower().endswith('.pdf')]
                  if pdfs:
                      result.append(pdfs[0])
              if not result:
                  raise ValueError('No PDF rows found; cannot establish completeness')
              if len(result) != len(set(result)):
                  raise ValueError('Duplicate paper identifiers in source; manual review required')
              return set(result)
          
          
          def select(spec, available):
              if spec.strip().lower() == 'all':
                  return sorted(available, reverse=True)
              wanted = set()
              for part in spec.split(','):
                  part = part.strip()
                  if re.fullmatch(r'\d{4}', part):
                      wanted.add(part)
                  elif re.fullmatch(r'\d{4}-\d{4}', part):
                      low, high = map(int, part.split('-'))
                      if low > high or high - low > 200:
                          raise ValueError('Invalid year range')
                      wanted.update(str(y) for y in range(low, high + 1))
                  else:
                      raise ValueError('years must be all, 2026, 2024-2026, or 2024,2026')
              if not wanted <= available.keys():
                  raise ValueError('Years not listed in source: ' + ', '.join(sorted(wanted - available.keys())))
              return sorted(wanted, reverse=True)
          
          
          class Client:
              def __init__(self):
                  self.last = 0
                  self.robot = None
                  self.delay = 1.0
          
              def raw(self, url):
                  # Only fetch index HTML from the source host, not PDF or arbitrary URLs.
                  if urlsplit(url).netloc != urlsplit(INDEX).netloc:
                      raise ValueError('Unexpected external redirect/source')
                  for attempt in range(3):
                      time.sleep(max(0, self.delay - (time.monotonic() - self.last)))
                      self.last = time.monotonic()
                      try:
                          with urlopen(Request(url, headers={'User-Agent': AGENT}), timeout=40) as response:
                              if urlsplit(response.geturl()).netloc != urlsplit(INDEX).netloc:
                                  raise ValueError('Unexpected redirect host')
                              data = response.read(10 * 1024 * 1024 + 1)
                              if len(data) > 10 * 1024 * 1024:
                                  raise ValueError('Index response too large')
                              return data.decode(response.headers.get_content_charset() or 'utf-8', 'replace')
                      except HTTPError as exc:
                          retry = exc.code in (408, 429, 500, 502, 503, 504)
                          wait = exc.headers.get('Retry-After', '')
                          exc.close()
                          if not retry or attempt == 2:
                              raise
                          if wait and (not wait.isdigit() or int(wait) > 120):
                              raise RuntimeError('Server requested a pause; rerun audit later') from exc
                          time.sleep(max(2 ** (attempt + 1), int(wait or 0)))
                      except (URLError, OSError):
                          if attempt == 2:
                              raise
                          time.sleep(2 ** (attempt + 1))
                  raise RuntimeError('Request failed')
          
              def get(self, url):
                  if self.robot is None:
                      self.robot = RobotFileParser()
                      try:
                          text = self.raw('https://saslexicon.org/robots.txt')
                          if '<html' in text.lower() or '<!doctype' in text.lower():
                              raise ValueError('Unexpected robots.txt content; cannot establish access policy')
                          self.robot.parse(text.splitlines())
                      except HTTPError as exc:
                          if exc.code not in (404, 410):
                              raise
                          self.robot.parse([])
                      self.delay = max(1, self.robot.crawl_delay(AGENT) or 0)
                  if not self.robot.can_fetch(AGENT, url):
                      raise ValueError('Source robots.txt disallows this page')
                  return self.raw(url)
          
          
          def check_file(record, folder):
              relative = record.get('path')
              if not isinstance(relative, str):
                  raise ValueError('Missing PDF path')
              path = Path(relative)
              if path.is_symlink() or not path.resolve().is_relative_to(folder.resolve()):
                  raise ValueError('PDF path outside expected year folder')
              if path.suffix.lower() != '.pdf' or not path.is_file():
                  raise ValueError('PDF is absent or not a file')
              if path.stat().st_size != record.get('bytes'):
                  raise ValueError('PDF byte count does not match catalog')
              with path.open('rb') as f:
                  if b'%PDF-' not in f.read(1024):
                      raise ValueError('PDF header missing (possibly an HTML error or LFS pointer)')
                  f.seek(max(0, path.stat().st_size - 8192))
                  if b'%%EOF' not in f.read():
                      raise ValueError('PDF EOF marker missing')
              sha = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      sha.update(block)
              if sha.hexdigest() != record.get('sha256'):
                  raise ValueError('PDF SHA-256 does not match catalog')
              return path.resolve()
          
          
          def inspect_pdf(path, folder):
              if path.is_symlink() or not path.resolve().is_relative_to(folder.resolve()):
                  raise ValueError('Unsafe path outside year folder')
              if not path.is_file() or path.suffix.lower() != '.pdf':
                  raise ValueError('Missing PDF file')
              size = path.stat().st_size
              with path.open('rb') as f:
                  if b'%PDF-' not in f.read(1024):
                      raise ValueError('Missing PDF header (possible error page or LFS pointer)')
                  f.seek(max(0, size - 8192))
                  if b'%%EOF' not in f.read():
                      raise ValueError('Missing PDF EOF marker')
              sha = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      sha.update(block)
              return {'bytes': size, 'sha256': sha.hexdigest()}
          
          
          def audit_year(year, expected, declared):
              folder = Path('PharmaSUG_US') / year
              issues, records = [], []
              try:
                  data = json.loads((folder / 'catalog.json').read_text('utf-8'))
                  if data.get('year') != int(year):
                      raise ValueError('Wrong/missing catalog year')
                  records = data['papers']
                  if not isinstance(records, list) or not all(isinstance(r, dict) and isinstance(r.get('id'), str) for r in records):
                      raise ValueError('Invalid catalog records')
              except Exception as exc:
                  records = []
                  issues.append(f'Catalog unavailable/invalid: {exc}')
              by_id = {r['id']: r for r in records}
              if len(by_id) != len(records):
                  issues.append('Duplicate catalog identifiers')
              if len(expected) != declared:
                  issues.append(f'Source discrepancy: main index {declared}; annual page {len(expected)}')
              for identity in sorted(by_id.keys() - expected):
                  issues.append('Catalog entry not in current source: ' + identity)
          
              # Inspect ALL local PDF files, even when their catalog status is pending/failed.
              local = sorted(p for p in folder.rglob('*') if p.is_file() and p.suffix.lower() == '.pdf') if folder.exists() else []
              inspected, local_errors = {}, {}
              names = {}
              for path in local:
                  names.setdefault(path.name, []).append(path)
                  try:
                      inspected[path.resolve()] = inspect_pdf(path, folder)
                  except Exception as exc:
                      local_errors[str(path)] = str(exc)
              hashes = Counter(info['sha256'] for info in inspected.values())
              duplicates = sum(n - 1 for n in hashes.values() if n > 1)
              good = present_only = absent = invalid = stale = candidate_only = missing_entries = 0
              used = set()
              for identity in sorted(expected):
                  r = by_id.get(identity, {})
                  if not r:
                      missing_entries += 1
                  status = r.get('status', 'no-catalog-entry')
                  relative = r.get('path')
                  path = Path(relative) if isinstance(relative, str) else None
                  if path is not None and (path.is_symlink() or not path.resolve().is_relative_to(folder.resolve())):
                      invalid += 1
                      issues.append(f'Unsafe catalog path: {relative}')
                      continue
                  if path is not None and path.is_file():
                      try:
                          info = inspected.get(path.resolve())
                          if info is None:
                              raise ValueError(local_errors.get(str(path), 'Not a valid PDF'))
                          if path.resolve() in used:
                              raise ValueError('Multiple source papers share one local path')
                          used.add(path.resolve())
                          if status != 'downloaded':
                              stale += 1
                          # Existing hash mismatch remains a failure; never replace a saved baseline.
                          if r.get('bytes') is not None and r['bytes'] != info['bytes']:
                              raise ValueError('Byte count mismatch against saved catalog')
                          if r.get('sha256') is not None and r['sha256'] != info['sha256']:
                              raise ValueError('SHA-256 mismatch against saved catalog')
                          if r.get('sha256') is not None and r.get('bytes') is not None:
                              good += 1
                              if status != 'downloaded':
                                  issues.append(f'File passes saved hash but catalog status is {status}: {path}')
                          else:
                              present_only += 1
                              issues.append(f'File present and passes lightweight PDF checks, but saved size/hash incomplete; status={status}: {path}')
                      except Exception as exc:
                          invalid += 1
                          issues.append(f'Invalid expected file {path}: {exc}')
                      continue
          
                  # Filename matches are diagnostic hints only, never proof of paper identity.
                  urls = [identity] + (r.get('urls', []) if isinstance(r.get('urls'), list) else [])
                  stems = set()
                  for url in urls:
                      if not isinstance(url, str):
                          continue
                      raw = unquote(Path(urlsplit(url).path).name)
                      stems.add(raw)
                      stems.add(re.sub(r'[^A-Za-z0-9.-]+', '-', Path(raw).stem).strip('.-') + '.pdf')
                  stem = unquote(Path(urlsplit(identity).path).stem)
                  stem = re.sub(r'[^A-Za-z0-9.-]+', '-', stem).strip('.-')[:110] or 'paper'
                  stems.add(stem + '-' + hashlib.sha256(identity.encode()).hexdigest()[:12] + '.pdf')
                  candidates = sorted({str(p) for name in stems for p in names.get(name, [])})
                  if candidates:
                      candidate_only += 1
                      issues.append(f'No file at catalog path {relative}; filename candidates ONLY (not identity-verified): ' + '; '.join(candidates))
                  else:
                      absent += 1
                      issues.append(f'No exact path/name match; status={status}; expected path={relative}; id={identity}')
              for name, error in local_errors.items():
                  issues.append(f'Local PDF failed lightweight check: {name}: {error}')
              if missing_entries:
                  issues.append(f'Missing source entries in catalog: {missing_entries}')
              return {'year': year, 'expected': len(expected), 'local': len(local), 'good': good,
                      'present-only': present_only, 'candidates': candidate_only, 'absent': absent,
                      'invalid': invalid, 'stale': stale, 'duplicate-copies': duplicates,
                      'local-valid': len(inspected), 'local-invalid': len(local_errors),
                      'unmapped': len(set(inspected) - used), 'issues': issues, 'pass': not issues}
          
          
          def emit(text):
              print(text)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
                      out.write(text + '\n')
          
          
          def main():
              try:
                  client = Client()
                  available = years_from_html(client.get(INDEX))
                  selected = select(os.environ.get('YEARS', 'all'), available)
              except Exception as exc:
                  emit('## Audit could not establish completeness\n\nSource/input error: ' + str(exc))
                  return 1
              rows = []
              for year in selected:
                  page, declared = available[year]
                  try:
                      result = audit_year(year, ids_from_html(client.get(page), page), declared)
                  except Exception as exc:
                      result = dict.fromkeys(['local', 'good', 'present-only', 'candidates', 'absent', 'invalid',
                                              'stale', 'duplicate-copies', 'local-valid', 'local-invalid', 'unmapped'], '?')
                      result.update(year=year, expected=declared, issues=['Could not audit year: ' + str(exc)], **{'pass': False})
                  rows.append(result)
                  print(f"{year}: local={result['local']}, catalog-hash-verified={result['good']}, present-without-baseline={result['present-only']}, filename-candidates={result['candidates']}", flush=True)
                  # Full diagnostics in logs; summary below limits per-year detail length.
                  for issue in result['issues']:
                      print('DETAIL ' + year + ': ' + str(issue).replace('\n', ' '), flush=True)
              ok = all(r['pass'] for r in rows)
              text = ['# PharmaSUG US completeness audit v2', '',
                      f"Verdict: **{'PASS — selected source papers and catalog checks passed' if ok else 'CHECK — review file coverage and metadata separately'}**", '',
                      f"Scope: `{os.environ.get('YEARS', 'all')}`; checkout: `{os.environ.get('GITHUB_SHA', 'local')}`.", '',
                      '| Year | Source | Local PDFs | Hash verified | Present/no full baseline | Filename candidates only | No exact match | Invalid expected files | Stale status on present files |',
                      '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |']
              for r in rows:
                  text.append(f"| {r['year']} | {r['expected']} | {r['local']} | {r['good']} | {r['present-only']} | {r['candidates']} | {r['absent']} | {r['invalid']} | {r['stale']} |")
              for r in rows:
                  text.extend(['', f"## {r['year']} details", '',
                               f"Local PDFs passing header/EOF checks: {r['local-valid']}; failing: {r['local-invalid']}; duplicate-content copies beyond first: {r['duplicate-copies']}; structurally valid files not linked by exact catalog paths: {r['unmapped']}."])
                  text.extend('- ' + str(issue).replace('\n', ' ') for issue in r['issues'][:12])
                  if len(r['issues']) > 12:
                      text.append(f"- Plus {len(r['issues']) - 12} issues; see this step's complete log.")
              text.extend(['', 'Interpretation:',
                           '- Hash verified: file matches the saved catalog size/SHA-256, even if catalog status is stale.',
                           '- Present/no full baseline: file exists at exact catalog path and passes lightweight PDF checks, but no full saved size/hash baseline; not silently promoted to verified.',
                           '- Filename candidates only: possible existing files identified by exact expected filename; not proof of paper identity.',
                           '- No exact match: no file at catalog path or exact candidate name. Arbitrary renamed files may still exist; do not equate this with confirmed absence.',
                           '- Extra/duplicate-content files do not establish source-paper coverage. Do not delete them automatically.',
                           '- Missing catalog files/entries, source discrepancies, stale metadata, unverifiable files, and invalid files keep the run CHECK.',
                           '- Read only: no paper downloads, metadata rewrites, deletes, or commits. Repository checkout still fetches existing Git files.',
                           '- A stored SHA-256 is not an independently trusted publisher checksum; header/EOF checks are not full PDF parsing.',
                           '- Run after downloading finishes, on the intended current branch. This checks a checkout snapshot, not subsequent commits.'])
              emit('\n'.join(text))
              return 0 if ok else 1
          
          
          if __name__ == '__main__':
              sys.exit(main())
          PY
