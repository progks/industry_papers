name: Download CDISC Interchange papers

on:
  workflow_dispatch:
    inputs:
      force-refresh:
        description: 'Re-download already verified files (normally leave unchecked)'
        type: boolean
        required: false
        default: false
      fail-on-incomplete:
        description: 'Mark the job failed if any of the 397 URLs remain unresolved; successful files are still published'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

# Use this same group in any OTHER workflow that writes to this repository.
concurrency:
  group: industry-papers-repository-write
  cancel-in-progress: false

