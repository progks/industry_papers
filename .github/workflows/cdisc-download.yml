jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install document validators
        run: python -m pip install 'requests>=2.32.4,<3' 'pypdf[crypto]>=6.4,<8'

      - name: Download the 397-file CDISC catalogue
        id: download
        continue-on-error: true
        env:
          CDISC_COOKIE: ${{ secrets.CDISC_COOKIE }}
          FORCE_REFRESH: ${{ inputs.force-refresh }}
        shell: bash
        run: |
          python -u - <<'PYTHON'
          #!/usr/bin/env python3
          """Download an embedded, fixed 397-URL CDISC catalogue. No website-completeness claim."""
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import sys
          import time
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from urllib.parse import urljoin, urlsplit
          from urllib.robotparser import RobotFileParser
          import zipfile
          
          import requests
          from pypdf import PdfReader
          
          ROOT = Path('CDISCInterchange')
          AGENT = 'IndustryPapersCDISCSync'
          MAX_BYTES = 95 * 1024 * 1024
          HOSTS = {'www.cdisc.org', 'cdisc.org'}
          CATALOGUE_SHA256 = 'f3805af1e73ccc2777e70a3b04453c9201a87af9b02a1ca479ba3f44bcb38bc3'
          
          
          class FetchError(Exception):
              def __init__(self, code, message):
                  self.code = code
                  super().__init__(message)
          
          
          def trusted(url):
              p = urlsplit(url)
              return (p.scheme == 'https' and p.hostname in HOSTS and p.port in (None, 443)
                      and p.username is None and p.password is None)
          
          
          def load_catalogue():
              data = gzip.decompress(base64.b64decode(os.environ['CDISC_CATALOGUE_B64']))
              if hashlib.sha256(data).hexdigest() != CATALOGUE_SHA256:
                  raise ValueError('Embedded catalogue checksum mismatch; restore the complete YML')
              entries = json.loads(data)
              if len(entries) != 397 or len({e['url'] for e in entries}) != 397:
                  raise ValueError('Embedded catalogue is not the expected 397 unique URLs')
              for e in entries:
                  if (not trusted(e['url']) or Path(urlsplit(e['url']).path).suffix.lower() not in ('.pdf', '.ppt', '.pptx')
                          or not re.fullmatch(r'20\d{2}', str(e['year']))):
                      raise ValueError('Unexpected catalogue entry')
              return entries
          
          
          def slug(value, limit=55):
              value = re.sub(r'[^a-zA-Z0-9]+', '-', str(value)).strip('-').lower()
              return (value[:limit].rstrip('-') or 'document')
          
          
          def destination(e):
              eventkey = slug(e['event']) + '-' + hashlib.sha256(e['source'].encode()).hexdigest()[:8]
              suffix = Path(urlsplit(e['url']).path).suffix.lower()
              stem = Path(e['filename']).stem
              # Preserve some original Unicode, while avoiding Windows-invalid names and long paths.
              stem = re.sub(r'[<>:"/\\|?*\x00-\x1f\s_]+', '-', stem).strip('.-')
              stem = stem.encode('utf-8')[:100].decode('utf-8', errors='ignore').rstrip('.-') or 'document'
              name = stem + '-' + hashlib.sha256(e['url'].encode()).hexdigest()[:12] + suffix
              path = ROOT / str(e['year']) / slug(e['category']) / slug(e['region'], 20) / eventkey / name
              if not path.resolve().is_relative_to(ROOT.resolve()):
                  raise ValueError('Destination escapes CDISCInterchange')
              return path
          
          
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          
          
          def validate(path, suffix):
              size = path.stat().st_size
              if not 8 <= size <= MAX_BYTES:
                  raise FetchError('INVALID_SIZE', 'Empty file or file exceeds 95 MiB limit')
              detail = {'bytes': size}
              if suffix == '.pdf':
                  with path.open('rb') as f:
                      if not f.read(1024).lstrip().startswith(b'%PDF-'):
                          raise FetchError('NOT_PDF', 'Response lacks a PDF header; may be a login/error page')
                      f.seek(max(0, size - 8192))
                      if b'%%EOF' not in f.read():
                          raise FetchError('TRUNCATED_PDF', 'PDF EOF marker missing')
                      f.seek(0)
                      reader = PdfReader(f, strict=False)
                      if reader.is_encrypted and not reader.decrypt(''):
                          raise FetchError('ENCRYPTED_REVIEW', 'PDF requires a password; not validated')
                      pages = len(reader.pages)
                      if pages == 0:
                          raise FetchError('EMPTY_PDF', 'PDF has no pages')
                      for page in reader.pages:
                          _ = page.mediabox
                          stream = page.get_contents()
                          if stream is not None:
                              stream.get_data()
                      detail['pages'] = pages
              elif suffix == '.pptx':
                  try:
                      with zipfile.ZipFile(path) as z:
                          names = set(z.namelist())
                          if not {'[Content_Types].xml', 'ppt/presentation.xml'} <= names:
                              raise FetchError('NOT_PPTX', 'Missing PowerPoint package parts')
                          if sum(i.file_size for i in z.infolist()) > 512 * 1024 * 1024:
                              raise FetchError('PPTX_TOO_LARGE', 'Uncompressed PowerPoint package exceeds safety limit')
                          bad = z.testzip()
                          if bad:
                              raise FetchError('PPTX_CRC', 'PowerPoint package failed CRC check')
                          slides = sum(bool(re.fullmatch(r'ppt/slides/slide\d+\.xml', n)) for n in names)
                          if not slides:
                              raise FetchError('EMPTY_PPTX', 'No PowerPoint slide parts found')
                          detail['slides'] = slides
                  except zipfile.BadZipFile as exc:
                      raise FetchError('NOT_PPTX', 'Invalid PowerPoint ZIP package') from exc
              elif suffix == '.ppt':
                  with path.open('rb') as f:
                      if f.read(8) != bytes.fromhex('d0cf11e0a1b11ae1'):
                          raise FetchError('NOT_PPT', 'Legacy PowerPoint OLE signature missing')
                  detail['validation-note'] = 'Legacy PPT signature check only, not full slide parsing'
              else:
                  raise FetchError('FORMAT', 'Unsupported file format')
              detail['sha256'] = sha256(path)
              return detail
          
          
          def retry_after(value):
              if not value:
                  return 0
              if value.isdigit():
                  return int(value)
              try:
                  return max(0, (parsedate_to_datetime(value) - datetime.now(timezone.utc)).total_seconds())
              except (TypeError, ValueError):
                  return 0
          
          
          class Client:
              def __init__(self, deadline):
                  self.session = requests.Session()
                  self.session.headers.update({'User-Agent': AGENT + '/1.0', 'Accept-Encoding': 'identity'})
                  self.cookie = os.environ.get('CDISC_COOKIE', '').strip()
                  self.deadline = deadline
                  self.policies = {}
                  self.policy_errors = {}
                  self.delay = 1.2
                  self.last = 0.0
          
              def wait(self, seconds):
                  if time.monotonic() + seconds >= self.deadline:
                      raise FetchError('TIME_BUDGET', 'Download time budget reached; rerun to resume')
                  time.sleep(max(0, seconds))
          
              def policy(self, url):
                  p = urlsplit(url)
                  origin = p.scheme + '://' + p.netloc
                  if origin in self.policy_errors:
                      raise FetchError('ROBOTS_UNAVAILABLE', self.policy_errors[origin])
                  if origin not in self.policies:
                      try:
                          with self.get(origin + '/robots.txt', robots=True) as response:
                              if response.status_code in (404, 410):
                                  text = ''
                              elif response.status_code in (401, 403):
                                  raise FetchError('ROBOTS_UNAVAILABLE', 'robots.txt access denied; no automated file fetch attempted')
                              else:
                                  if response.status_code != 200:
                                      raise FetchError('ROBOTS_UNAVAILABLE', 'robots.txt unavailable; retry later')
                                  text = response.text
                          rp = RobotFileParser()
                          rp.parse(text.splitlines())
                          self.policies[origin] = rp
                          self.delay = max(self.delay, float(rp.crawl_delay(AGENT) or 0))
                          rate = rp.request_rate(AGENT)
                          if rate and rate.requests:
                              self.delay = max(self.delay, rate.seconds / rate.requests)
                      except Exception as exc:
                          self.policy_errors[origin] = 'robots.txt could not be read; no policy bypass'
                          raise FetchError('ROBOTS_UNAVAILABLE', self.policy_errors[origin]) from exc
                  if not self.policies[origin].can_fetch(AGENT, url):
                      raise FetchError('ROBOTS_DISALLOWED', 'robots.txt disallows this URL')
          
              def get(self, url, referer=None, robots=False):
                  for _ in range(6):
                      if not trusted(url):
                          raise FetchError('EXTERNAL_REDIRECT', 'Off-site request/redirect refused; no cookie forwarded')
                      if re.search(r'/(?:user/login|login|sso)(?:/|$)', urlsplit(url).path, re.I):
                          raise FetchError('LOGIN_REQUIRED', 'File redirects to login; authorized access required')
                      if not robots:
                          self.policy(url)
                      response = None
                      for attempt in range(4):
                          self.wait(max(0, self.delay - (time.monotonic() - self.last)))
                          self.last = time.monotonic()
                          headers = {'Referer': referer} if referer else {}
                          if self.cookie:
                              headers['Cookie'] = self.cookie  # trusted hosts only; never persisted/logged.
                          try:
                              response = self.session.get(url, headers=headers, stream=True,
                                                          allow_redirects=False, timeout=(15, 90))
                          except requests.RequestException as exc:
                              if attempt == 3:
                                  raise FetchError('NETWORK', 'Connection failed or timed out after retries') from exc
                              self.wait(2 ** (attempt + 1))
                              continue
                          if response.status_code in (429, 500, 502, 503, 504) and attempt < 3:
                              delay = max(retry_after(response.headers.get('Retry-After')), 2 ** (attempt + 1))
                              response.close()
                              self.wait(delay)
                              continue
                          break
                      if response is None:
                          raise FetchError('NETWORK', 'No HTTP response')
                      if response.status_code in (301, 302, 303, 307, 308):
                          location = response.headers.get('Location')
                          response.close()
                          if not location:
                              raise FetchError('REDIRECT', 'Redirect response has no Location')
                          url = urljoin(url, location)
                          continue
                      return response
                  raise FetchError('REDIRECT', 'Too many redirects')
          
              def download(self, e, path):
                  path.parent.mkdir(parents=True, exist_ok=True)
                  temporary = path.with_suffix(path.suffix + '.part')
                  for attempt in range(3):
                      try:
                          if shutil.disk_usage(path.parent).free < 256 * 1024 * 1024:
                              raise FetchError('DISK_SPACE', 'Less than 256 MiB free disk space')
                          with self.get(e['url'], e['source']) as r:
                              if r.status_code in (401, 403):
                                  raise FetchError('ACCESS_RESTRICTED', f'HTTP {r.status_code}; not bypassed')
                              if r.status_code == 404:
                                  raise FetchError('NOT_FOUND', 'HTTP 404')
                              if r.status_code != 200:
                                  raise FetchError('HTTP_ERROR', f'HTTP {r.status_code}')
                              if 'text/html' in r.headers.get('Content-Type', '').lower():
                                  raise FetchError('HTML_RESPONSE', 'HTML returned instead of a document; possible login/error page')
                              length = r.headers.get('Content-Length', '')
                              if length.isdigit() and int(length) > MAX_BYTES:
                                  raise FetchError('TOO_LARGE', 'File exceeds configured 95 MiB limit')
                              size = 0
                              with temporary.open('wb') as f:
                                  for block in r.iter_content(128 * 1024):
                                      if time.monotonic() >= self.deadline:
                                          raise FetchError('TIME_BUDGET', 'Download time budget reached; rerun to resume')
                                      size += len(block)
                                      if size > MAX_BYTES:
                                          raise FetchError('TOO_LARGE', 'File exceeds configured 95 MiB limit')
                                      f.write(block)
                              if (length.isdigit() and r.headers.get('Content-Encoding', 'identity').lower() == 'identity'
                                      and size != int(length)):
                                  raise FetchError('TRANSFER_LENGTH', 'Content-Length mismatch; possible truncated transfer')
                          result = validate(temporary, path.suffix.lower())
                          temporary.replace(path)
                          return result
                      except Exception as exc:
                          temporary.unlink(missing_ok=True)
                          retryable = (not isinstance(exc, FetchError) or exc.code in
                                       {'NETWORK', 'TRANSFER_LENGTH', 'TRUNCATED_PDF', 'NOT_PDF', 'PPTX_CRC', 'NOT_PPTX'})
                          if attempt == 2 or not retryable:
                              raise
                          self.wait(2 ** (attempt + 1))
          
          
          def writejson(path, value):
              temporary = path.with_suffix('.tmp')
              temporary.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              temporary.replace(path)
          
          
          def main(entries=None, client=None):
              ROOT.mkdir(parents=True, exist_ok=True)
              entries = load_catalogue() if entries is None else entries
              manifest_path = ROOT / 'manifest.json'
              previous = json.loads(manifest_path.read_text(encoding='utf-8')) if manifest_path.exists() else []
              records = {r['url']: r for r in previous}
              client = client or Client(time.monotonic() + 70 * 60)
              failures, downloaded, verified = [], 0, 0
              force = os.environ.get('FORCE_REFRESH', 'false').lower() == 'true'
              writejson(ROOT / 'catalogue.json', {'snapshot-date': '2026-11-20', 'entries': entries,
                                                 'scope': '397 previously inventoried URLs, NOT the whole CDISC website'})
              for i, e in enumerate(entries, 1):
                  try:
                      path = destination(e)
                      old = records.get(e['url'], {})
                      info = None
                      if path.exists() and not force:
                          try:
                              info = validate(path, path.suffix.lower())
                              if old.get('sha256') and info['sha256'] != old['sha256']:
                                  raise ValueError('Existing file hash differs from saved manifest')
                              verified += 1
                          except Exception:
                              info = None
                      if info is None:
                          info = client.download(e, path)
                          downloaded += 1
                      records[e['url']] = {**e, 'path': path.as_posix(), **info, 'status': 'ok'}
                      print(f'OK {i}/{len(entries)} {path.name}', flush=True)
                  except Exception as exc:
                      code = exc.code if isinstance(exc, FetchError) else type(exc).__name__
                      error = str(exc)
                      cookie = os.environ.get('CDISC_COOKIE', '')
                      if cookie:
                          error = error.replace(cookie, '[redacted]')
                      failures.append({'url': e['url'], 'filename': e['filename'], 'code': code, 'error': error})
                      if e['url'] in records:
                          records[e['url']] = {**records[e['url']], 'status': 'unresolved-this-run', 'last-failure-code': code}
                      print(f'UNRESOLVED {i}/{len(entries)} {code}: {e["filename"]}', flush=True)
              ordered = sorted(records.values(), key=lambda r: r['url'])
              writejson(manifest_path, ordered)
              writejson(ROOT / 'failures.json', failures)
              current_urls = {e['url'] for e in entries}
              summary = {'catalogue-urls': len(entries), 'downloaded-this-run': downloaded,
                         'verified-existing': verified, 'unresolved-this-run': len(failures),
                         'current-catalogue-complete': not failures,
                         'whole-cdisc-site-complete': False,
                         'historical-manifest-entries': len(records),
                         'manifest-entries-in-current-catalogue': sum(r['url'] in current_urls for r in ordered)}
              writejson(ROOT / 'run-summary.json', summary)
              text = ('## CDISCInterchange download\n\n'
                      f'- Catalogue: **{len(entries)} URLs** (fixed snapshot, not the whole website)\n'
                      f'- Downloaded this run: **{downloaded}**\n'
                      f'- Verified existing files: **{verified}**\n'
                      f'- Unresolved: **{len(failures)}**\n'
                      f'- This catalogue: **{"COMPLETE" if not failures else "INCOMPLETE"}**\n'
                      '- Repository push is a separate step; see Repository submission below.\n')
              if failures:
                  text += '\n### Unresolved files (first 40; full list in failures.json)\n\n```json\n'
                  text += json.dumps(failures[:40], ensure_ascii=False, indent=2) + '\n```\n'
              print(text)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                      f.write(text)
              return 1 if failures else 0
          
          
          if __name__ == '__main__':
              sys.exit(main())
          PYTHON

      - name: Back up files before repository submission
        id: backup
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/upload-artifact@v7
        with:
          name: cdisc-interchange-files
          path: |
            CDISCInterchange/
            !CDISCInterchange/**/*.part
            !CDISCInterchange/**/*.tmp
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

      - name: Commit and push CDISCInterchange in bounded batches
        id: publish
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          python -u - <<'PYTHON'
          #!/usr/bin/env python3
          """Publish only CDISCInterchange, using bounded commits and non-forced, rebased pushes."""
          import os
          import json
          from pathlib import Path
          import random
          import subprocess
          import sys
          import time
          
          ROOT = Path('CDISCInterchange')
          BATCH_BYTES = 150 * 1024 * 1024
          BATCH_FILES = 50
          
          
          def git(*args, capture=False, check=True):
              return subprocess.run(['git', *args], check=check, text=True, capture_output=capture)
          
          
          def note(text):
              print(text)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                      f.write('\n' + text + '\n')
          
          
          def main():
              if not ROOT.is_dir():
                  note('### Repository submission\nNo CDISCInterchange output directory was produced.')
                  return 1
              branch = os.environ['TARGET_BRANCH']
              if git('check-ref-format', '--branch', branch, capture=True, check=False).returncode:
                  raise ValueError('Invalid default branch')
              for pattern in ('*.part', '*.tmp'):
                  for p in ROOT.rglob(pattern):
                      if p.is_file():
                          p.unlink()
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              changed = git('diff', '--name-only', '-z', 'HEAD', '--', str(ROOT), capture=True).stdout
              untracked = git('ls-files', '--others', '--exclude-standard', '-z', '--', str(ROOT), capture=True).stdout
              manifest = ROOT / 'manifest.json'
              records = json.loads(manifest.read_text(encoding='utf-8')) if manifest.exists() else []
              generated = {str(ROOT / name) for name in ('catalogue.json', 'manifest.json', 'failures.json', 'run-summary.json')}
              for record in records:
                  path = Path(record['path'])
                  if not path.resolve().is_relative_to(ROOT.resolve()):
                      raise ValueError('Manifest publish path is outside CDISCInterchange')
                  if path.suffix.lower() in {'.pdf', '.ppt', '.pptx'}:
                      generated.add(path.as_posix())
              tracked = set(git('ls-files', '-z', '--', str(ROOT), capture=True).stdout.split('\0'))
              modified = set(p for p in (changed + untracked).split('\0') if p)
              # Include generated documents even if a repository-level *.pdf rule ignores them.
              paths = sorted((modified | {p for p in generated - tracked if Path(p).is_file()}) & generated)
              paths.sort(key=lambda p: (Path(p).suffix.lower() in {'.json', '.md'}, p))
              batches, batch, size = [], [], 0
              for p in paths:
                  n = Path(p).stat().st_size if Path(p).exists() else 0
                  if batch and (len(batch) >= BATCH_FILES or size + n > BATCH_BYTES):
                      batches.append(batch)
                      batch, size = [], 0
                  batch.append(p)
                  size += n
              if batch:
                  batches.append(batch)
              if not batches:
                  note('### Repository submission\nNo output changes to commit. Existing repository files were retained.')
                  return 0
              # Commit all batches first, keeping a clean worktree for every rebase.
              for i, files in enumerate(batches, 1):
                  git('add', '-f', '--', *files)
                  git('commit', '-m', f'Sync CDISCInterchange files ({i}/{len(batches)})')
              pushed = 0
              while True:
                  for attempt in range(1, 9):
                      git('fetch', 'origin', branch)
                      if git('rebase', f'origin/{branch}', check=False).returncode:
                          git('rebase', '--abort', check=False)
                          note('### Repository submission FAILED\nActual rebase conflict. No force push was attempted. Use the artifact backup.')
                          return 1
                      commits = git('rev-list', '--reverse', f'origin/{branch}..HEAD', capture=True).stdout.splitlines()
                      if not commits:
                          head = git('rev-parse', 'HEAD', capture=True).stdout.strip()
                          note(f'### Repository submission SUCCESS\nPublished to `{branch}`. Final commit: `{head}`. Bounded commits pushed: {pushed}.')
                          return 0
                      # Push just the next bounded commit; following pushes reuse objects already uploaded.
                      result = git('push', 'origin', f'{commits[0]}:refs/heads/{branch}', check=False)
                      if result.returncode == 0:
                          pushed += 1
                          break
                      if attempt == 8:
                          note('### Repository submission FAILED\nEight non-forced push attempts failed. Inspect the actual git error above; downloads may still be available in the artifact.')
                          return 1
                      delay = 10 * attempt + random.randrange(10)
                      print(f'Push rejected; waiting {delay}s, then fetch/rebase again.', flush=True)
                      time.sleep(delay)
          
          
          if __name__ == '__main__':
              sys.exit(main())
          PYTHON

      - name: Explain artifact backup failure
        if: ${{ !cancelled() && steps.backup.outcome == 'failure' }}
        run: |
          echo '### Artifact backup warning' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact upload failed. Inspect its log and repository submission separately; successful git pushes do not require the artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain repository submission failure
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        run: |
          echo '### Repository submission FAILED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Files may exist only on the runner or partially in the repository. If backup succeeded, download cdisc-interchange-files from this run. Inspect the publish step for the actual git error.' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail only after preserving completed files when strict mode is enabled
        if: ${{ !cancelled() && inputs.fail-on-incomplete && steps.download.outcome == 'failure' }}
        run: |
          echo 'The catalogue is INCOMPLETE. This status is separate from repository submission.'
          echo 'Successful downloads were preserved if publishing or artifact backup succeeded.'
          echo 'Inspect CDISCInterchange/failures.json and the Summary. HTTP 403/login restrictions are not bypassed.'
          exit 1

      - name: Highlight non-strict partial completion
        if: ${{ !cancelled() && !inputs.fail-on-incomplete && steps.download.outcome == 'failure' }}
        run: |
          echo '### INCOMPLETE: non-strict mode was selected' >> "$GITHUB_STEP_SUMMARY"
          echo 'The job may be green, but some files remain unresolved. See CDISCInterchange/failures.json; this is NOT a complete download.' >> "$GITHUB_STEP_SUMMARY"
