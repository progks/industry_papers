name: Download PharmaSUG China Papers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: industry-papers-repository-write
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32.4,<3' 'beautifulsoup4>=4.13.4,<5'

      - name: Download all listed China papers
        id: download
        continue-on-error: true
        shell: bash
        run: |
          python -u - <<'PYTHON'
          #!/usr/bin/env python3
          """Mirror directly linked PharmaSUG CN PDFs; serial, resumable, robots-aware."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import time
          from urllib.parse import urldefrag, urljoin, urlsplit, unquote
          from urllib.robotparser import RobotFileParser
          
          import requests
          from bs4 import BeautifulSoup
          
          INDEX = 'https://saslexicon.org/PharmaSUG_CN/PharmaSUG_CN.html'
          ROOT = Path('PharmaSUG_CN')
          AGENT = 'IndustryPapersSync'
          MAX_BYTES = 95 * 1024 * 1024  # Leave headroom below GitHub's regular Git limit.
          
          
          def scoped(url):
              p = urlsplit(url)
              return (p.scheme == 'https' and p.netloc == 'saslexicon.org'
                      and p.path.startswith('/PharmaSUG_CN/'))
          
          
          def links(html, base, kind):
              found = {}
              for a in BeautifulSoup(html, 'html.parser').select('a[href]'):
                  url = urldefrag(urljoin(base, a['href']))[0]
                  title = a.get_text(' ', strip=True)
                  path = urlsplit(url).path
                  if not scoped(url):
                      continue
                  if kind == 'year' and re.fullmatch(r'20\d{2}', title) and path.lower().endswith('.html'):
                      found[url] = title
                  elif kind == 'pdf' and path.lower().endswith('.pdf'):
                      found.setdefault(url, title or unquote(path.rsplit('/', 1)[-1]))
              return sorted(found.items())
          
          
          def indexcounts(html, base):
              """Read declared counts only from the entry page Year/Papers table."""
              counts = {}
              for row in BeautifulSoup(html, 'html.parser').select('tr'):
                  cells = row.find_all(['td', 'th'], recursive=False)
                  if len(cells) < 2:
                      continue
                  year = cells[0].find('a', href=True)
                  count = cells[1].get_text(' ', strip=True)
                  if (year is None or not re.fullmatch(r'20\d{2}', year.get_text(strip=True))
                          or not re.fullmatch(r'\d+', count)):
                      continue
                  url = urldefrag(urljoin(base, year['href']))[0]
                  if scoped(url):
                      counts[url] = int(count)
              return counts
          
          
          def localpath(year, url):
              stem = Path(unquote(urlsplit(url).path.rsplit('/', 1)[-1])).stem
              stem = re.sub(r'[^A-Za-z0-9.\-]+', '-', stem).strip('.-')[:120] or 'paper'
              suffix = hashlib.sha256(url.encode()).hexdigest()[:12]
              return ROOT / year / f'{stem}-{suffix}.pdf'
          
          
          def inspect(path):
              """Lightweight PDF/transfer check, not a complete PDF parser."""
              if not path.is_file() or not 8 <= path.stat().st_size <= MAX_BYTES:
                  raise ValueError('Missing, empty, or oversized PDF')
              with path.open('rb') as f:
                  if not f.read(1024).lstrip().startswith(b'%PDF-'):
                      raise ValueError('Response is not a PDF (possibly an HTML error page)')
                  f.seek(max(0, path.stat().st_size - 4096))
                  if b'%%EOF' not in f.read():
                      raise ValueError('PDF EOF marker missing; possible truncated download')
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return path.stat().st_size, h.hexdigest()
          
          
          class Client:
              def __init__(self):
                  self.session = requests.Session()
                  self.session.headers['User-Agent'] = AGENT + '/1.0 (serial paper archive)'
                  self.last = 0.0
                  self.delay = 1.0
                  self.policy = None
          
              def get(self, url, referer=None, robots=False):
                  if not robots and not scoped(url):
                      raise ValueError(f'URL outside source scope: {url}')
                  if self.policy is not None and not self.policy.can_fetch(AGENT, url):
                      raise PermissionError(f'robots.txt disallows: {url}')
                  for attempt in range(4):
                      time.sleep(max(0, self.delay - (time.monotonic() - self.last)))
                      self.last = time.monotonic()
                      try:
                          r = self.session.get(url, timeout=(15, 90), stream=True,
                                               allow_redirects=False,
                                               headers={'Referer': referer or INDEX})
                      except requests.RequestException:
                          if attempt == 3:
                              raise
                          time.sleep(2 ** (attempt + 1))
                          continue
                      if r.status_code in (429, 500, 502, 503, 504) and attempt < 3:
                          wait = r.headers.get('Retry-After', '')
                          r.close()
                          if wait.isdigit():
                              time.sleep(max(int(wait), 2 ** (attempt + 1)))
                          else:
                              time.sleep(2 ** (attempt + 1))
                          continue
                      # Refuse redirects, rather than following off-site links or bypassing policy.
                      if 300 <= r.status_code < 400:
                          r.close()
                          raise RuntimeError(f'Redirect requires manual review: {url}')
                      return r
                  raise RuntimeError('Request retries exhausted')
          
              def initrobots(self):
                  with self.get('https://saslexicon.org/robots.txt', robots=True) as r:
                      if r.status_code in (404, 410):
                          text = ''
                      else:
                          r.raise_for_status()  # Fail closed on denied/unavailable policy.
                          text = r.text
                  self.policy = RobotFileParser()
                  self.policy.parse(text.splitlines())
                  self.delay = max(1.0, float(self.policy.crawl_delay(AGENT) or 0))
                  rate = self.policy.request_rate(AGENT)
                  if rate and rate.requests:
                      self.delay = max(self.delay, rate.seconds / rate.requests)
          
              def html(self, url):
                  with self.get(url) as r:
                      r.raise_for_status()
                      return r.text
          
              def download(self, url, destination, referer):
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  temporary = destination.with_suffix('.part')
                  for attempt in range(3):
                      try:
                          with self.get(url, referer) as r:
                              r.raise_for_status()
                              declared = r.headers.get('Content-Length', '')
                              if declared.isdigit() and int(declared) > MAX_BYTES:
                                  raise ValueError('PDF exceeds configured 95 MiB limit')
                              size = 0
                              with temporary.open('wb') as f:
                                  for block in r.iter_content(128 * 1024):
                                      size += len(block)
                                      if size > MAX_BYTES:
                                          raise ValueError('PDF exceeds configured 95 MiB limit')
                                      f.write(block)
                              if (declared.isdigit() and not r.headers.get('Content-Encoding')
                                      and size != int(declared)):
                                  raise ValueError('Content-Length mismatch')
                          result = inspect(temporary)
                          temporary.replace(destination)
                          return result
                      except (requests.RequestException, OSError, ValueError):
                          temporary.unlink(missing_ok=True)
                          if attempt == 2:
                              raise
                          time.sleep(2 ** (attempt + 1))
          
          
          def writejson(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = path.with_suffix('.tmp')
              temporary.write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              temporary.replace(path)
          
          
          def main():
              ROOT.mkdir(parents=True, exist_ok=True)
              manifest = ROOT / 'manifest.json'
              previous = json.loads(manifest.read_text(encoding='utf-8')) if manifest.exists() else []
              records = {row['url']: row for row in previous}
              failures = []
              warnings = []
              downloaded = skipped = discovered = 0
              client = Client()
              try:
                  client.initrobots()
                  indexhtml = client.html(INDEX)
                  years = links(indexhtml, INDEX, 'year')
                  expectedcounts = indexcounts(indexhtml, INDEX)
                  if not years:
                      raise ValueError('No year links found; source HTML may have changed')
                  for yearurl, year in years:
                      try:
                          html = client.html(yearurl)
                          papers = links(html, yearurl, 'pdf')
                          if not papers:
                              raise ValueError('No directly linked PDFs found')
                          expected = expectedcounts.get(yearurl)
                          if expected is not None and expected != len(papers):
                              warnings.append({'year': year, 'url': yearurl,
                                               'index-papers': expected,
                                               'unique-pdf-links': len(papers),
                                               'warning': 'Source index count differs from directly linked PDFs; source completeness is not confirmed'})
                          print(f'{year}: {len(papers)} PDF links', flush=True)
                      except Exception as e:
                          failures.append({'url': yearurl, 'error': str(e)})
                          continue
                      for url, title in papers:
                          discovered += 1
                          path = localpath(year, url)
                          try:
                              old = records.get(url, {})
                              try:
                                  size, sha = inspect(path)
                                  if old.get('sha256') and old['sha256'] != sha:
                                      raise ValueError('Local file hash changed')
                                  skipped += 1
                              except (ValueError, OSError):
                                  size, sha = client.download(url, path, yearurl)
                                  downloaded += 1
                              records[url] = {'year': year, 'title': title, 'url': url,
                                              'index': yearurl, 'path': path.as_posix(),
                                              'bytes': size, 'sha256': sha}
                              print(f'OK {path.name}', flush=True)
                          except Exception as e:
                              failures.append({'url': url, 'error': str(e)})
                              print(f'FAIL {url}: {e}', flush=True)
              except Exception as e:
                  failures.append({'url': INDEX, 'error': str(e)})
              # Retain earlier successful records if a year page is temporarily unavailable.
              writejson(manifest, sorted(records.values(), key=lambda r: (r['year'], r['url'])))
              writejson(ROOT / 'failures.json', failures)
              writejson(ROOT / 'warnings.json', warnings)
              summary = (f'## PharmaSUG CN sync\n\n'
                         f'- Discovered this run: {discovered}\n- Downloaded: {downloaded}\n'
                         f'- Verified existing: {skipped}\n- Failures: {len(failures)}\n'
                         f'- Source count warnings: {len(warnings)}\n'
                         f'- Manifest entries (including earlier runs): {len(records)}\n')
              if warnings:
                  summary += '\n### Source count warnings\n\n```json\n' + json.dumps(warnings, ensure_ascii=False, indent=2) + '\n```\n'
              print(summary)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                      f.write(summary)
              return 1 if failures else 0
          
          
          if __name__ == '__main__':
              sys.exit(main())
          PYTHON

      - name: Show local download location
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        shell: bash
        run: |
          echo "Runner workspace: $GITHUB_WORKSPACE"
          echo "PDF directory: $GITHUB_WORKSPACE/PharmaSUG_CN"
          if [ -d PharmaSUG_CN ]; then
            find PharmaSUG_CN -type f -name '*.pdf' | wc -l
            du -sh PharmaSUG_CN
          fi

      - name: Back up PDFs independently of git push
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pharmasug-cn-papers
          path: |
            PharmaSUG_CN/
            !PharmaSUG_CN/**/*.part
            !PharmaSUG_CN/**/*.tmp
          retention-days: 14
          if-no-files-found: warn

      - name: Display exact synchronization errors
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          path = Path('PharmaSUG_CN/failures.json')
          if path.exists():
              errors = json.loads(path.read_text(encoding='utf-8'))
              details = json.dumps(errors, ensure_ascii=False, indent=2)
          else:
              details = 'No failures.json was produced. Inspect the download step log.'
          print('Exact synchronization errors:')
          print(details)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('\n### Exact synchronization errors\n\n```json\n' + details + '\n```\n')
          PYTHON

      - name: Commit downloaded papers and reports
        id: commit
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d PharmaSUG_CN ]; then
            exit 0
          fi
          find PharmaSUG_CN -type f \( -name '*.part' -o -name '*.tmp' \) -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- PharmaSUG_CN
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Sync PharmaSUG China papers and reports'
          for attempt in $(seq 1 8); do
            echo "Push attempt $attempt of 8"
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo 'Rebase has a real content conflict. No changes were force-pushed.'
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              printf '\n### Repository submission\n\nPush succeeded to `%s`. Commit: `%s`.\n' "$TARGET_BRANCH" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              delay=$((10 * attempt + RANDOM % 10))
              echo "Push rejected; waiting $delay seconds before fetching and rebasing again."
              sleep "$delay"
            fi
          done
          echo 'Push failed after 8 attempts. Check competing writers and the actual git error above.'
          exit 1

      - name: Explain failed repository submission
        if: ${{ !cancelled() && steps.commit.outcome == 'failure' }}
        shell: bash
        run: |
          echo '### Repository submission failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The PDFs were downloaded to the runner, but git submission failed. Inspect the Commit downloaded papers and reports step. If artifact backup succeeded, download pharmasug-cn-papers from this run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report incomplete download
        if: ${{ !cancelled() && steps.download.outcome == 'failure' }}
        run: |
          echo 'Actual fetch or file validation errors occurred. See PharmaSUG_CN/failures.json.'
          echo 'Completed files were retained if the commit step succeeded. Rerun to retry.'
          exit 1
