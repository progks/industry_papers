# Save in your repository as .github/workflows/PHUSE_APAC.yml
# Standalone workflow. No additional Python file or requirements file is needed.
name: PHUSE APAC - Download All Papers

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'all = every indexed year; or enter 2026'
        required: true
        default: 'all'
        type: string
      limit:
        description: '0 = all; test first N main PDFs per year otherwise'
        required: true
        default: '0'
        type: string
      dry-run:
        description: 'Check ONLY for a simulation with NO downloads or commits'
        required: true
        default: false
        type: boolean
  # Optional weekly update; enable after the first successful full download.
  # schedule:
  #   - cron: '17 4 * * 0'

permissions:
  contents: write

concurrency:
  # Matches the supplied US/EU workflows: serialize writes to the same repository.
  group: phuse-us-sync
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Download APAC main PDFs and push checkpoints
        env:
          PYTHONUNBUFFERED: '1'
          SELECTED_YEAR: ${{ inputs.year || 'all' }}
          PAPER_LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs['dry-run'] && 'true' || 'false' }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time
          from urllib.parse import urljoin, urlsplit, urldefrag, unquote
          from urllib.robotparser import RobotFileParser

          import requests
          from bs4 import BeautifulSoup

          INDEX = 'https://saslexicon.org/PHUSE_APAC/PHUSE_APAC.html'
          ROOT = Path('PHUSE_APAC')
          MAX_BYTES = 95 * 1024 * 1024
          AGENT = 'IndustryPapersArchiver'


          def years_from(html):
              years = {}
              for link in BeautifulSoup(html, 'html.parser').select('a[href]'):
                  year = link.get_text(' ', strip=True)
                  url = urljoin(INDEX, link['href'])
                  if (re.fullmatch(r'20\d{2}', year)
                          and urlsplit(url).netloc == urlsplit(INDEX).netloc
                          and re.search(r'/PHUSE_APAC/' + year + r'/[^/]+\.html$', urlsplit(url).path)):
                      years[year] = url
              if not years:
                  raise RuntimeError('No APAC year links found; check the index structure')
              return dict(sorted(years.items(), reverse=True))


          def papers_from(html, base):
              papers, seen = [], set()
              for row in BeautifulSoup(html, 'html.parser').select('tr'):
                  cells = row.find_all('td', recursive=False)
                  if len(cells) < 6 or not cells[0].get_text(strip=True).isdigit():
                      continue
                  title = cells[1].get_text(' ', strip=True)
                  links = []
                  for link in cells[5].select('a[href]'):
                      # Main source only: do not add separately labelled slide/poster attachments.
                      if link.get_text(' ', strip=True).lower() == 'source':
                          links.append(urljoin(base, link['href']))
                  title_link = cells[1].find('a', href=True)
                  if title_link:
                      links.append(urljoin(base, title_link['href']))
                  urls = list(dict.fromkeys(urldefrag(url)[0] for url in links
                                           if urlsplit(url).path.lower().endswith('.pdf')))
                  if not urls:
                      raise RuntimeError(f'Numbered entry has no PDF candidate: {title}')
                  if urls[0] in seen:
                      continue
                  seen.add(urls[0])
                  stem = Path(unquote(urlsplit(urls[0]).path)).stem
                  stem = re.sub(r'[^A-Za-z0-9.-]+', '-', stem).strip('.-')[:90] or 'paper'
                  suffix = hashlib.sha256(urls[0].encode()).hexdigest()[:10]
                  papers.append(dict(title=title, authors=cells[2].get_text(' ', strip=True),
                                     abstract=cells[3].get_text(' ', strip=True),
                                     keywords=cells[4].get_text(' ', strip=True),
                                     source_urls=urls, filename=f'{stem}-{suffix}.pdf'))
              if not papers:
                  raise RuntimeError(f'No APAC paper rows found: {base}')
              return papers


          class Fetcher:
              def __init__(self, delay=0.8):
                  self.session = requests.Session()
                  repo = os.getenv('GITHUB_REPOSITORY', 'progks/industry_papers')
                  self.session.headers['User-Agent'] = f'{AGENT}/1.0 (+https://github.com/{repo})'
                  self.delay, self.robots, self.last = delay, {}, {}

              def policy(self, url):
                  parts = urlsplit(url)
                  if parts.scheme != 'https':
                      raise RuntimeError(f'Only HTTPS is allowed: {url}')
                  origin = f'https://{parts.netloc}'
                  if origin not in self.robots:
                      robots_url = origin + '/robots.txt'
                      with self.session.get(robots_url, timeout=(15, 45)) as response:
                          print(f'ROBOTS {robots_url} -> HTTP {response.status_code}', flush=True)
                          parser = RobotFileParser(robots_url)
                          # RFC 9309 2.3.1.3: robots 4xx is unavailable, not a site-wide ban.
                          # 429 is retried as a temporary error. Actual PDF 401/403 still fails.
                          if 400 <= response.status_code < 500 and response.status_code != 429:
                              parser.parse([])
                          else:
                              response.raise_for_status()
                              if 'text/html' in response.headers.get('Content-Type', '').lower():
                                  raise RuntimeError(f'Unexpected HTML robots file: {robots_url}')
                              parser.parse(response.text.splitlines())
                      self.robots[origin] = parser
                      self.last[origin] = time.monotonic()
                  parser = self.robots[origin]
                  if not parser.can_fetch(AGENT, url):
                      raise RuntimeError(f'robots.txt disallows: {url}')
                  interval = max(self.delay, parser.crawl_delay(AGENT) or 0)
                  rate = parser.request_rate(AGENT)
                  if rate and rate.requests:
                      interval = max(interval, rate.seconds / rate.requests)
                  time.sleep(max(0, interval - (time.monotonic() - self.last.get(origin, 0))))
                  self.last[origin] = time.monotonic()

              def get(self, url, stream=False):
                  for _ in range(6):
                      self.policy(url)
                      response = self.session.get(url, stream=stream, allow_redirects=False, timeout=(15, 90))
                      if response.status_code in (301, 302, 303, 307, 308):
                          location = response.headers.get('Location')
                          response.close()
                          if not location:
                              raise RuntimeError('Redirect has no Location header')
                          url = urljoin(url, location)
                          continue
                      try:
                          response.raise_for_status()
                      except Exception:
                          response.close()
                          raise
                      return response
                  raise RuntimeError('Too many redirects')

              @staticmethod
              def retry(exc, attempt):
                  response = getattr(exc, 'response', None)
                  status = getattr(response, 'status_code', None)
                  transient = isinstance(exc, requests.RequestException) and (
                      status is None or status in (408, 429) or status >= 500)
                  if attempt == 2 or not transient:
                      return False
                  value = getattr(response, 'headers', {}).get('Retry-After', '')
                  time.sleep(max(5 * 2 ** attempt, int(value) if value.isdigit() else 0))
                  return True

              def text(self, url):
                  for attempt in range(3):
                      try:
                          with self.get(url) as response:
                              return response.text
                      except Exception as exc:
                          if not self.retry(exc, attempt):
                              raise

              def download(self, url, path):
                  partial = path.with_suffix('.part')
                  for attempt in range(3):
                      try:
                          with self.get(url, stream=True) as response:
                              if int(response.headers.get('Content-Length', '0')) > MAX_BYTES:
                                  raise ValueError('PDF exceeds the 95 MiB safety limit')
                              size = 0
                              with partial.open('wb') as handle:
                                  for chunk in response.iter_content(128 * 1024):
                                      if chunk:
                                          size += len(chunk)
                                          if size > MAX_BYTES:
                                              raise ValueError('PDF exceeds the 95 MiB safety limit')
                                          handle.write(chunk)
                          if not valid_pdf(partial):
                              with partial.open('rb') as handle:
                                  preview = handle.read(160)
                              kind = response.headers.get('Content-Type', '(missing)')
                              raise ValueError(f'Invalid/truncated PDF; Content-Type={kind}; prefix={preview!r}')
                          partial.replace(path)
                          return
                      except Exception as exc:
                          partial.unlink(missing_ok=True)
                          if not self.retry(exc, attempt):
                              raise


          def valid_pdf(path):
              if not path.is_file() or not (10 <= path.stat().st_size <= MAX_BYTES):
                  return False
              with path.open('rb') as handle:
                  head = handle.read(1024)
                  handle.seek(max(0, path.stat().st_size - 4096))
                  tail = handle.read()
              return b'%PDF-' in head and b'%%EOF' in tail


          def sha256(path):
              with path.open('rb') as handle:
                  return hashlib.file_digest(handle, 'sha256').hexdigest()


          def git(*args):
              subprocess.run(['git', *args], check=True)


          def checkpoint(folder, records, commit, branch):
              temp = folder / 'manifest.tmp'
              temp.write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              temp.replace(folder / 'manifest.json')
              if not commit:
                  return
              git('add', '--', str(folder))
              code = subprocess.run(['git', 'diff', '--cached', '--quiet', '--', str(folder)]).returncode
              if code == 0:
                  return
              if code != 1:
                  raise RuntimeError('Could not inspect staged changes')
              git('commit', '-m', f'Sync PHUSE APAC {folder.name} papers', '--', str(folder))
              for attempt in range(3):
                  if subprocess.run(['git', 'push', 'origin', f'HEAD:refs/heads/{branch}']).returncode == 0:
                      return
                  if attempt < 2:
                      time.sleep(5)
                      git('pull', '--rebase', 'origin', branch)
              raise RuntimeError('Push failed; check write permissions and branch rules')


          def main(year='all', limit=0, dry_run=False, commit=True, branch='main'):
              if (year != 'all' and not re.fullmatch(r'20\d{2}', year)) or limit < 0:
                  raise ValueError('year must be all or a four-digit year; limit must be >= 0')
              fetcher = Fetcher()
              years = years_from(fetcher.text(INDEX))
              if year != 'all':
                  if year not in years:
                      raise ValueError(f'Year not present in APAC index: {year}')
                  years = {year: years[year]}
              summaries, failures = [], []
              for year, index in years.items():
                  print(f'\n=== PHUSE APAC {year}: {index} ===', flush=True)
                  try:
                      records = papers_from(fetcher.text(index), index)
                  except Exception as exc:
                      failures.append(f'{year}: {type(exc).__name__}: {exc}')
                      print(f'ERROR {failures[-1]}', flush=True)
                      continue
                  selected = records[:limit] if limit else records
                  if dry_run:
                      print(json.dumps({'year': year, 'discovered': len(records), 'sample': selected[:3]},
                                       ensure_ascii=False, indent=2), flush=True)
                      summaries.append(f'| {year} | {len(records)} | {len(selected)} | 0 | 0 | 0 |')
                      continue
                  folder = ROOT / year
                  folder.mkdir(parents=True, exist_ok=True)
                  manifest = folder / 'manifest.json'
                  previous = json.loads(manifest.read_text(encoding='utf-8')) if manifest.exists() else []
                  old = {r['filename']: r for r in previous}
                  catalog = [{**old.get(r['filename'], {}), **r} for r in records]
                  by_name = {r['filename']: r for r in catalog}
                  downloaded = existing = failed = 0
                  for n, entry in enumerate(selected, 1):
                      r = by_name[entry['filename']]
                      path = folder / r['filename']
                      ok = valid_pdf(path) and (not r.get('sha256') or sha256(path) == r['sha256'])
                      if ok:
                          existing += 1
                      else:
                          errors = []
                          for url in r['source_urls']:
                              try:
                                  fetcher.download(url, path)
                                  r['downloaded_from'] = url
                                  ok = True
                                  downloaded += 1
                                  break
                              except Exception as exc:
                                  error = f'{url}: {type(exc).__name__}: {exc}'
                                  errors.append(error)
                                  print(f'WARNING {year}/{r["filename"]}: {error}', flush=True)
                          if not ok:
                              path.unlink(missing_ok=True)
                              r.update(status='failed', error=' | '.join(errors))
                              for field in ('sha256', 'bytes', 'downloaded_from'):
                                  r.pop(field, None)
                              failed += 1
                              failures.append(f'{year}/{r["filename"]}')
                      if ok:
                          r.update(status='ok', bytes=path.stat().st_size, sha256=sha256(path))
                          r.pop('error', None)
                      print(f'{year} {n}/{len(selected)} {r["status"]} {r["filename"]}', flush=True)
                      if n % 10 == 0:
                          checkpoint(folder, catalog, commit, branch)
                  checkpoint(folder, catalog, commit, branch)
                  summaries.append(f'| {year} | {len(records)} | {len(selected)} | {downloaded} | {existing} | {failed} |')
              summary = ('## PHUSE APAC download summary\n\n'
                         '| Year | Discovered | Selected | Downloaded | Existing | Failed |\n'
                         '|---|---:|---:|---:|---:|---:|\n' + '\n'.join(summaries) + '\n')
              if dry_run:
                  summary += '\n**DRY RUN: no PDF downloads, commits, or repository changes.**\n'
              if failures:
                  summary += f'\nFailures: {len(failures)}. See WARNING/ERROR logs and yearly manifest.json.\n'
              print(summary, flush=True)
              if os.getenv('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
                      handle.write(summary)
              return 1 if failures else 0


          if __name__ == '__main__':
              raise SystemExit(main(
                  year=os.getenv('SELECTED_YEAR', 'all').strip(),
                  limit=int(os.getenv('PAPER_LIMIT', '0')),
                  dry_run=os.getenv('DRY_RUN', 'false').lower() == 'true',
                  branch=os.getenv('TARGET_BRANCH', 'main')))
          PYTHON
